; Waveshare ESP32-S3-Knob-Touch-LCD-1.8
;
; pioarduino 51.03.07 is required, not a preference:
;   - stock `platform = espressif32` ships ESP-IDF 4.4, which lacks the QSPI
;     panel IO APIs this board's ST77916 needs;
;   - Arduino core 3.1+ refactored the BLE library away from the Bluedroid
;     BLESecurityCallbacks / esp_ble_gatts_cb_param_t signatures that
;     src/ble_bridge.cpp is written against.
; 51.03.07 pins Arduino 3.0.7 / IDF 5.1, the one combination satisfying both.
[env:knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 8MB octal PSRAM + 16MB quad flash. The 360x360 RGB565 canvas is 259,200
; bytes and only fits in PSRAM, so BOARD_HAS_PSRAM + qio_opi are mandatory.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions_knob.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial arrives over the S3's native USB-CDC, not a UART bridge, so
    ; without this Serial.print() output never appears.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; Arduino_GFX defaults the QSPI bus to 40MHz. Black backgrounds showed a
    ; fine line pattern while solid white stayed uniform - the signature of
    ; marginal timing, since a flipped bit lights a pixel on black but is
    ; nearly invisible on white. 20MHz trades frame rate for a clean black.
    -DESP32QSPI_FREQUENCY=20000000

build_src_filter = +<*> +<buddies/> +<hal/> -<tests/>

lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
; No DRV2605 library: hal/haptics.cpp talks to the chip directly over Wire
; (five register writes), which avoids pulling in Adafruit BusIO and SPI.

; Stage-1 bring-up sketch: panel only, none of the firmware.
[env:paneltest]
extends = env:knob
build_src_filter = -<*> +<hal/panel.cpp> +<tests/panel_test.cpp>
lib_deps = moononournation/GFX Library for Arduino @ 1.5.0

; Stages 2+3 bring-up: touch, knob and haptics.
[env:inputtest]
extends = env:knob
build_src_filter = -<*> +<hal/panel.cpp> +<hal/input.cpp> +<hal/haptics.cpp> +<tests/input_test.cpp>
lib_deps = moononournation/GFX Library for Arduino @ 1.5.0
